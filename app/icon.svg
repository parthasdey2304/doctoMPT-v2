<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="50%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    
    <!-- AI Badge Gradient -->
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Coat Gradient -->
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Stethoscope Metallic Gradient -->
    <linearGradient id="stethGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle inner border ring -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-opacity="0.35" />

  <!-- Digital Tech Grid / Sparkles in Background -->
  <circle cx="100" cy="110" r="4" fill="#5eead4" opacity="0.6" />
  <circle cx="410" cy="130" r="5" fill="#5eead4" opacity="0.6" />
  <circle cx="90" cy="370" r="4" fill="#5eead4" opacity="0.4" />
  <circle cx="430" cy="370" r="4" fill="#5eead4" opacity="0.4" />

  <!-- Doctor Body / Shoulders (White Clinical Coat) -->
  <path d="M 126 512 C 126 410 170 340 256 340 C 342 340 386 410 386 512 Z" fill="url(#coatGrad)" />
  
  <!-- Inner Scrub Top (Teal V-Neck) -->
  <polygon points="216,340 296,340 256,410" fill="#0d9488" />

  <!-- Coat Lapels -->
  <path d="M 200 340 L 236 430 L 210 512" fill="none" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" />
  <path d="M 312 340 L 276 430 L 302 512" fill="none" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" />

  <!-- Stethoscope around Neck -->
  <path d="M 190 320 C 180 370 190 440 230 450" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round" />
  <path d="M 322 320 C 332 370 322 430 282 450" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round" />
  <path d="M 230 450 C 245 455 260 455 272 445 L 272 468" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round" />
  <circle cx="272" cy="478" r="16" fill="url(#stethGrad)" stroke="#1e293b" stroke-width="5" />
  <circle cx="272" cy="478" r="8" fill="#0d9488" />

  <!-- Doctor Neck -->
  <rect x="232" y="270" width="48" height="75" rx="10" fill="#fed7aa" opacity="0.95" />

  <!-- Doctor Head / Face -->
  <ellipse cx="256" cy="225" rx="72" ry="82" fill="#fed7aa" />

  <!-- Friendly Eyes -->
  <ellipse cx="228" cy="220" rx="7" ry="9" fill="#0f172a" />
  <ellipse cx="284" cy="220" rx="7" ry="9" fill="#0f172a" />
  <!-- Eye highlights -->
  <circle cx="226" cy="217" r="2.5" fill="#ffffff" />
  <circle cx="282" cy="217" r="2.5" fill="#ffffff" />

  <!-- Eyebrows -->
  <path d="M 216 205 Q 228 198 240 205" fill="none" stroke="#334155" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 272 205 Q 284 198 296 205" fill="none" stroke="#334155" stroke-width="3.5" stroke-linecap="round" />

  <!-- Nose -->
  <path d="M 256 222 L 252 236 L 260 236" fill="none" stroke="#ea580c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" />

  <!-- Warm Smile -->
  <path d="M 240 254 Q 256 270 272 254" fill="none" stroke="#991b1b" stroke-width="4" stroke-linecap="round" />

  <!-- Doctor Hair -->
  <path d="M 180 205 C 180 145 210 135 256 135 C 302 135 332 145 332 205 C 336 175 320 120 256 120 C 192 120 176 175 180 205 Z" fill="#1e293b" />
  <path d="M 184 200 L 184 230 C 184 235 190 235 190 225 Z" fill="#1e293b" />
  <path d="M 328 200 L 328 230 C 328 235 322 235 322 225 Z" fill="#1e293b" />

  <!-- Doctor Surgical Cap / Headband with Medical Cross -->
  <path d="M 184 185 C 195 150 220 140 256 140 C 292 140 317 150 328 185 Z" fill="#0f766e" />
  <rect x="180" y="174" width="152" height="20" rx="8" fill="#14b8a6" />
  <!-- Mini Cross on Headband -->
  <rect x="252" y="178" width="8" height="12" rx="2" fill="#ffffff" />
  <rect x="248" y="182" width="16" height="4" rx="1.5" fill="#ffffff" />

  <!-- Glowing AI Doctor Emblem / Badge -->
  <g filter="url(#glow)">
    <rect x="296" y="48" width="156" height="70" rx="35" fill="url(#aiGrad)" stroke="#a5f3fc" stroke-width="4" />
    <path d="M 314 83 L 326 83 M 422 83 L 434 83" stroke="#a5f3fc" stroke-width="3" stroke-linecap="round" />
    <text x="374" y="97" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">AI</text>
  </g>

  <!-- Sparkle on AI badge -->
  <polygon points="440,54 443,63 452,66 443,69 440,78 437,69 428,66 437,63" fill="#fef08a" />

  <!-- Medical Cross Badge in Corner -->
  <g opacity="0.9">
    <circle cx="92" cy="420" r="32" fill="#042f2e" stroke="#2dd4bf" stroke-width="3.5" />
    <rect x="86" y="402" width="12" height="36" rx="4" fill="#2dd4bf" />
    <rect x="74" y="414" width="36" height="12" rx="4" fill="#2dd4bf" />
  </g>
</svg>